[package]
name = "jxlrs_wic"
version = "0.1.0"
edition = "2021"
authors = ["YRSB"]
description = "Pure Rust Windows Imaging Component (WIC) decoder for JPEG XL"
license = "BSD-3-Clause"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
windows = { version = "0.58", features = [
    "Win32_Foundation",
    "Win32_Graphics_Imaging",
    "Win32_System_Com",
    "Win32_System_SystemServices",
    "Win32_System_Registry",
    "Win32_UI_Shell",
] }
windows-core = "0.58"
jxl = { git = "https://github.com/libjxl/jxl-rs" }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true
