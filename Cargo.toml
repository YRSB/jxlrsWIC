[package]
name = "jxlrs_wic"
version = "0.2.0"
edition = "2021"
authors = ["YRSB"]
description = "Pure Rust Windows Imaging Component (WIC) decoder for JPEG XL"
license = "BSD-3-Clause"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
windows = { version = "0.58", features = [
    "implement",
    "Win32_Foundation",
    "Win32_Graphics_Imaging",
    "Win32_System_Com",
    "Win32_System_SystemServices",
    "Win32_System_Registry",
    "Win32_System_LibraryLoader",
    "Win32_Security",
    "Win32_UI_Shell",
] }
windows-core = "0.58"
thiserror = "2.0"
# Pinned so the decoder API this crate codes against cannot drift underneath CI.
jxl = { git = "https://github.com/libjxl/jxl-rs", rev = "87620c4f566a7204865b3bcdc160033114a9a253" }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
# Deliberately not `abort`: this crate is an in-process COM server, so an unwinding panic is
# caught inside the Decoder Seam and reported as a failed decode. Aborting would
# instead kill the host process (Explorer, Photos) over a single malformed bitstream.
panic = "unwind"
strip = true
