name: Release

on:
  push:
    tags: ["v*"]
  # Building from a branch produces the same archives but skips the publish job, so the
  # pipeline can be exercised before the first tag exists.
  workflow_dispatch:

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  package:
    name: Package (${{ matrix.target }})
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        target:
          - x86_64-pc-windows-msvc
          - aarch64-pc-windows-msvc
          - i686-pc-windows-msvc
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2
        with:
          key: release-${{ matrix.target }}

      - name: Build release cdylib
        run: cargo build --release --target ${{ matrix.target }}

      - name: Assemble distribution archive
        shell: pwsh
        run: |
          $target = "${{ matrix.target }}"
          $name = "jxlrs_wic-$target"
          $dll = "target/$target/release/jxlrs_wic.dll"
          if (-not (Test-Path $dll)) {
            throw "Expected release cdylib at $dll was not produced"
          }

          New-Item -ItemType Directory -Force -Path "dist/$name" | Out-Null
          Copy-Item $dll "dist/$name/"
          Copy-Item LICENSE, README.md "dist/$name/"

          # Archive the contents only, so the zip unpacks into the current directory.
          Compress-Archive -Path "dist/$name/*" -DestinationPath "dist/$name.zip" -CompressionLevel Optimal

          $hash = (Get-FileHash "dist/$name.zip" -Algorithm SHA256).Hash.ToLowerInvariant()
          Set-Content -Path "dist/$name.zip.sha256" -Value $hash -NoNewline
          Write-Host "$name.zip sha256=$hash"

      - name: Upload distribution archive
        uses: actions/upload-artifact@v4
        with:
          name: jxlrs_wic-${{ matrix.target }}
          path: dist/*
          if-no-files-found: error

  verify-checksums:
    name: Verify published checksums
    needs: package
    runs-on: windows-latest
    steps:
      - name: Download all distribution archives
        uses: actions/download-artifact@v4
        with:
          merge-multiple: true
          path: dist

      - name: Verify every checksum matches its archive
        shell: pwsh
        run: |
          $failures = @()
          Get-ChildItem dist/*.zip.sha256 | ForEach-Object {
            $expected = (Get-Content $_.FullName -Raw).Trim().ToLowerInvariant()
            $archive = $_.FullName -replace '\.sha256$', ''
            $actual = (Get-FileHash $archive -Algorithm SHA256).Hash.ToLowerInvariant()
            if ($expected -ne $actual) {
              $failures += "$(Split-Path $archive -Leaf): expected $expected, got $actual"
            } else {
              Write-Host "OK $(Split-Path $archive -Leaf)"
            }
          }
          if ($failures.Count -gt 0) {
            throw "Checksum mismatch:`n$($failures -join "`n")"
          }

  release:
    name: Publish GitHub Release
    needs: [package, verify-checksums]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check the tag matches the crate version
        shell: bash
        run: |
          version="$(sed -n 's/^version = "\(.*\)"$/\1/p' Cargo.toml | head -n1)"
          if [ "v$version" != "${GITHUB_REF_NAME}" ]; then
            echo "Tag ${GITHUB_REF_NAME} does not match crate version $version" >&2
            exit 1
          fi

      - name: Download all distribution archives
        uses: actions/download-artifact@v4
        with:
          merge-multiple: true
          path: dist

      - name: Aggregate checksums
        shell: bash
        run: |
          cd dist
          # Keep the per-archive .sha256 files: the README tells users to read them. The
          # aggregate file is a convenience for anyone verifying the whole set at once.
          sha256sum *.zip | tee sha256.sum

      - name: Create GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" dist/* \
            --title "jxlrsWIC ${GITHUB_REF_NAME}" \
            --generate-notes
