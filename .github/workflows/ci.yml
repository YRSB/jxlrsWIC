name: CI

on:
  push:
    branches: ["main", "prototype/**", "implement/**"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  # Database fixtures and decoder tests must fail loudly, never skip, in CI.
  JXLRS_REQUIRE_COM: "1"

jobs:
  check-format:
    name: Rustfmt & Clippy
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2

      - name: Check code formatting
        run: cargo fmt --all -- --check

      - name: Run clippy
        run: cargo clippy --all-targets -- -D warnings

  build-and-test:
    name: Build & Test (${{ matrix.target }})
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-pc-windows-msvc
            run_tests: true
          - target: aarch64-pc-windows-msvc
            run_tests: false
          # Shipped alongside the other architectures so 32-bit WIC hosts can load the
          # decoder. Built but not exercised: no 32-bit COM host is available on the runner.
          - target: i686-pc-windows-msvc
            run_tests: false
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Run unit tests (x86_64 native host)
        if: matrix.run_tests
        run: cargo test --target ${{ matrix.target }} --lib --verbose

      - name: Build release cdylib
        run: cargo build --release --target ${{ matrix.target }}

      - name: Compile integration test binaries
        if: matrix.run_tests
        run: cargo test --target ${{ matrix.target }} --test wic_com_e2e --no-run --verbose

      - name: Register decoder, run WIC end-to-end suite, unregister
        if: matrix.run_tests
        shell: pwsh
        run: |
          $dllPath = (Resolve-Path "target/${{ matrix.target }}/release/jxlrs_wic.dll").Path
          $testExe = Get-ChildItem "target/${{ matrix.target }}/debug/deps/wic_com_e2e-*.exe" |
            Select-Object -First 1
          if (-not $testExe) {
            throw "wic_com_e2e test binary was not built"
          }
          # The test binary loads `jxlrs_wic.dll` from its own directory before PATH, so the
          # `DllGetClassObject` it exports is the one COM binds for the registered CLSID.
          Write-Host "Test runner: $($testExe.FullName)"

          Write-Host "Registering COM server with regsvr32: $dllPath"
          $regProc = Start-Process -FilePath "regsvr32.exe" -ArgumentList "/s", "`"$dllPath`"" -Wait -PassThru -NoNewWindow
          if ($regProc.ExitCode -ne 0) {
            throw "regsvr32 registration failed with exit code $($regProc.ExitCode)"
          }
          Write-Host "regsvr32 registration completed successfully."

          try {
            Write-Host "Running WIC registration verification..."
            pwsh -File ./tests/verify_wic_registration.ps1 -DllPath "$dllPath"

            $env:JXLRS_REQUIRE_COM = "1"
            Write-Host "Running headless WIC COM end-to-end suite..."
            & $testExe.FullName --test-threads=1
            if ($LASTEXITCODE -ne 0) {
              throw "WIC end-to-end suite failed with exit code $LASTEXITCODE"
            }
          }
          finally {
            Write-Host "Unregistering COM server with regsvr32 /u..."
            $unregProc = Start-Process -FilePath "regsvr32.exe" -ArgumentList "/s", "/u", "`"$dllPath`"" -Wait -PassThru -NoNewWindow
            if ($unregProc.ExitCode -ne 0) {
              throw "regsvr32 unregistration failed with exit code $($unregProc.ExitCode)"
            }
            Write-Host "regsvr32 unregistration completed successfully."
          }

          Write-Host "Running WIC unregistration cleanup verification..."
          pwsh -File ./tests/verify_wic_registration.ps1 -DllPath "$dllPath" -Unregistered

      - name: Upload DLL artifact
        uses: actions/upload-artifact@v4
        with:
          name: jxlrs_wic-${{ matrix.target }}
          path: target/${{ matrix.target }}/release/jxlrs_wic.dll
          if-no-files-found: error
