name: CI

on:
  push:
    branches: [ "main", "prototype/**" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  check-format:
    name: Rustfmt & Clippy
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2

      - name: Check code formatting
        run: cargo fmt --all -- --check

      - name: Run clippy
        run: cargo clippy --all-targets -- -D warnings

  build-and-test:
    name: Build & Test (${{ matrix.target }})
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-pc-windows-msvc
            run_tests: true
          - target: aarch64-pc-windows-msvc
            run_tests: false
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Run tests (x86_64 native host)
        if: matrix.run_tests
        run: cargo test --target ${{ matrix.target }} --verbose

      - name: Build release cdylib
        run: cargo build --release --target ${{ matrix.target }}

      - name: Verify COM registration with regsvr32 (x86_64)
        if: matrix.run_tests
        shell: pwsh
        run: |
          $dllPath = (Resolve-Path "target/${{ matrix.target }}/release/jxlrs_wic.dll").Path
          Write-Host "Registering COM server with regsvr32: $dllPath"
          $regProc = Start-Process -FilePath "regsvr32.exe" -ArgumentList "/s", "`"$dllPath`"" -Wait -PassThru -NoNewWindow
          if ($regProc.ExitCode -ne 0) {
            throw "regsvr32 registration failed with exit code $($regProc.ExitCode)"
          }
          Write-Host "regsvr32 registration completed successfully."

          Write-Host "Running WIC registration verification..."
          pwsh -File ./tests/verify_wic_registration.ps1 -DllPath "$dllPath"

          Write-Host "Unregistering COM server with regsvr32 /u..."
          $unregProc = Start-Process -FilePath "regsvr32.exe" -ArgumentList "/s", "/u", "`"$dllPath`"" -Wait -PassThru -NoNewWindow
          if ($unregProc.ExitCode -ne 0) {
            throw "regsvr32 unregistration failed with exit code $($unregProc.ExitCode)"
          }
          Write-Host "regsvr32 unregistration completed successfully."

          Write-Host "Running WIC unregistration cleanup verification..."
          pwsh -File ./tests/verify_wic_registration.ps1 -DllPath "$dllPath" -Unregistered

      - name: Upload DLL artifact
        uses: actions/upload-artifact@v4
        with:
          name: jxlrs_wic-${{ matrix.target }}
          path: target/${{ matrix.target }}/release/jxlrs_wic.dll
          if-no-files-found: error
